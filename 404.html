<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Not Found | AuditableCompute.com</title>
  <meta name="description" content="The requested page was not found on AuditableCompute.com." />
  <link rel="canonical" href="https://www.auditablecompute.com/404.html" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050914" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root{
      --bg:#050914;--card:#0b1220;--border:rgba(255,255,255,.08);
      --text:#e9eefc;--muted:rgba(233,238,252,.78);--accent:#22e6c6;
      --shadow:0 18px 55px rgba(0,0,0,.45);--radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(900px 500px at 25% 0%, rgba(34,230,198,.16), transparent 55%), var(--bg);
      color:var(--text);
      padding:22px;
    }
    .card{
      width:min(760px, 100%);
      background: rgba(11,18,32,.72);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:22px;
      text-align:left;
    }
    h1{margin:0 0 10px;font-size:22px}
    p{margin:0;color:var(--muted);line-height:1.6}
    a{
      display:inline-flex;margin-top:14px;
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(34,230,198,.35);
      background: rgba(34,230,198,.10);
      color:var(--text);text-decoration:none;font-weight:700;
    }
    a:hover{background: rgba(34,230,198,.16)}
  </style>
</head>
<body>
  <div class="card">
    <h1>404 - Not Found</h1>
    <p>The requested page does not exist on <b>AuditableCompute.com</b>.</p>
    <a href="/">Return to homepage</a>
  </div>
</body>
</html>
